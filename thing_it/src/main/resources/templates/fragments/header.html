<header xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="header-inner">
        <div class="logo">
            <span class="heart">♥</span>건강한 식탁
        </div>
        <nav>
            <a href="/" th:classappend="${currentPage == 'home'} ? ' active' : ''">홈</a>
            <a href="/disease" th:classappend="${currentPage == 'disease'} ? ' active' : ''">질병 알아보기</a>
            <a href="/food" th:classappend="${currentPage == 'food'} ? ' active' : ''">지병 맞춤 식재료 추천</a>
            <a href="/mypage" th:classappend="${currentPage == 'mypage'} ? ' active' : ''">마이페이지</a>
        </nav>
        <div class="header-right">
            <div class="search-box">🔍 질병, 부위 검색</div>
            <div class="icon-btn">🔔</div>
<!--             <a href="/login">로그인</a>-->
<!--            isAuthenticated로그인 한 사람에게만 보이는 파라미터-->
            <div th:if="${loggedIn}">
                <span th:text="${loginName}"></span> 님 환영합니다.
                <form th:action="@{/logout}" method="post">
                    <button class="btn" type="submit">로그아웃</button>
                </form>
            </div>
            <div th:unless="${loggedIn}">
                <a th:href="@{/login}">로그인</a>
            </div>
        </div>
    </div>
</header>
