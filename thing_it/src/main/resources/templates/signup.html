<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: headContent}"></th:block>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">
<div class="login-container">
    <header th:replace="~{fragments/header2 :: header}"></header>
    <main class="card">
        <h2 class="card-title">회원가입</h2>
        <p class="card-welcome">건강한 식탁과 함께 시작해 보세요!</p>
        <!-- 회원가입 실패 메시지 -->
        <p class="field-error"  th:text="${errorMessage}" th:classappend="${errorMessage != null} ? ' show' : ''"></p>
        <form id="signupForm" th:action="@{/signup}" method="post" novalidate>
            <div class="form-group">
                <div class="input-wrapper">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" name="userid" id="userid" class="input-field" th:value="${signupRequest?.userid}"
                           placeholder="아이디를 입력해주세요" required>
                </div>
                <p class="field-error" id="useridError"
                    th:text="${useridError}" th:classappend="${idError != null} ? ' show' : ''">></p>
            </div>
            <!-- 이름 -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" name="name" id="name" class="input-field" th:value="${signupRequest?.name}"
                           placeholder="이름을 입력해주세요" required>
                </div>
                <p class="field-error" id="nameError"
                   th:text="${nameError}" th:classappend="${nameError != null} ? ' show' : ''"></p>
            </div>

            <!-- 이메일 -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" name="email" id="email" class="input-field" th:value="${signupRequest?.email}"
                           placeholder="이메일을 입력해주세요" required>
                </div>
                <p class="field-error" id="emailError"
                    th:text="${emailError}" th:classappend="${emailError != null} ? ' show' : ''"></p>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" name="password" id="password" class="input-field"
                           placeholder="비밀번호 (8자 이상)" required>
                    <button type="button" class="toggle-password" data-target="passwordInput">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
                <ul class="pw-rules" id="pwRules">
                    <li data-rule="length"><i data-lucide="circle"></i><span>8자 이상</span></li>
                    <li data-rule="letter"><i data-lucide="circle"></i><span>영문 포함</span></li>
                    <li data-rule="number"><i data-lucide="circle"></i><span>숫자 포함</span></li>
                    <li data-rule="special"><i data-lucide="circle"></i><span>특수문자 포함</span></li>
                </ul>
                <p class="field-error" id="passwordError"
                    th:text="${passwordError}" th:classappend="${passwordError != null} ? ' show' : ''"></p>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i data-lucide="lock-keyhole" class="input-icon"></i>
                    <input type="password" name="passwordConfirm" id="passwordConfirm" class="input-field"
                           placeholder="비밀번호를 다시 입력해주세요" required>
                    <button type="button" class="toggle-password" data-target="passwordConfirm">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
                <p class="field-error" id="passwordConfirmError"
                  th:text="${passwordConfirmError}" th:classappend="${passwordConfirmError != null} ? ' show' : ''"></p>
            </div>
            <!-- 성별 -->
            <div class="form-group">
                <p class="field-label">성별</p>
                <div class="chip-group">
                    <label class="chip"><input type="radio" name="gender" value="MALE" th:checked="${signupRequest?.gender=='MALE'}"><span>남성</span></label>
                    <label class="chip"><input type="radio" name="gender" value="FEMALE" th:checked="${signupRequest?.gender=='FEMALE'}"><span>여성</span></label>
                </div>
                <p class="field-error" id="genderError"
                    th:text="${genderError}" th:classappend="${genderError != null} ? ' show' : ''"></p>
            </div>

            <!-- 약관 동의 -->
            <div class="agree-list">
                <label class="checkbox-container">
                    <input type="checkbox" id="agreeAll">
                    <span class="bold">전체 동의</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" class="agree-item" name="terms_agree" id="terms_agree" value="Y" required>
                    <span>[필수] 이용약관 동의</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" class="agree-item" name="privacy_agree" id="privacy_agree" value="Y" required>
                    <span>[필수] 개인정보 수집·이용 동의</span>
                </label>
            </div>
            <p class="field-error" id="agreeError"
                th:text="${agreeError}" th:classappend="${agreeError != null} ? ' show' : ''"></p>

            <button type="submit" class="btn-primary">회원가입</button>
        </form>

        <div class="divider"><span>또는</span></div>

        <div class="signup-prompt">
            이미 계정이 있으신가요? <a th:href="@{/login}" class="signup-link">로그인</a>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="/js/login.js"></script>
</body>
</html>
